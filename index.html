<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>自分会議、開催中</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">
    <header class="app-header">
      <p class="eyebrow">AI Doppelgänger Discussion App</p>
      <h1>自分会議、開催中</h1>
      <p class="header-text">
        もう一人のあなたが、あなたの価値観で議論する。
      </p>

      <div id="authArea" class="auth-area">
        <div id="loggedOut" style="display:none;">
          <a href="/auth/login" class="login-button">Googleでログイン</a>
        </div>
        <div id="loggedIn" style="display:none;" class="user-info">
          <img id="userPicture" src="" alt="" class="user-avatar" />
          <span id="userName"></span>
          <a href="/auth/logout" class="logout-button">ログアウト</a>
        </div>
      </div>
    </header>

    <main class="main-layout">
      <section class="panel form-panel">
        <div class="section-heading">
          <span class="step-badge">Step 1</span>
          <h2>分身プロフィール</h2>
        </div>

        <div class="form-grid">
          <input id="nameInput" type="text" placeholder="名前">
          <input id="personalityInput" type="text" placeholder="性格">
          <input id="hobbyInput" type="text" placeholder="趣味">
          <textarea id="thoughtInput" placeholder="普段の考え方"></textarea>
          <input id="topicInput" type="text" placeholder="テーマ、AIに議論してほしいこと(未入力の場合AIが自動生成します。)">
        </div>

        <div class="situation-selector" style="margin: 15px 0; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 6px;">
          <label style="font-weight: bold; display: block; margin-bottom: 8px; font-size: 0.9rem; color: #a090a8;">🏛️ 議論シチュエーション設定：</label>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button type="button" id="btn-standard" class="active" onclick="changeSituation('standard')" style="background: #4a5568; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer;">標準</button>
            <button type="button" id="btn-diet" onclick="changeSituation('diet')" style="background: #2b6cb0; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer;">🏛️ 国会答弁</button>
            <button type="button" id="btn-friends" onclick="changeSituation('friends')" style="background: #b7791f; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer;">🍟 友達とファミレス</button>
            <button type="button" id="btn-random" onclick="changeSituationRandom()" style="background: #6b46c1; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer;">🎲 ランダムでおまかせ</button>
          </div>
        </div>

        <div class="slider-container">
          <div class="slider-top">
            <span class="slider-title">煽りレベル</span>
            <span id="roastLabel" class="roast-label">普通</span>
          </div>

          <input
            type="range"
            id="roastSlider"
            min="0"
            max="3"
            step="1"
            value="1"
          >

          <div class="roast-description">
            議論中の皮肉・挑発の強さを調整します
          </div>
        </div>

        <button id="summonButton" class="primary-button" onclick="summonAI()">
          分身を召喚する
        </button>

        <button id="autoDebateButton" class="secondary-button" onclick="startAutoDebate()" disabled>
          AI同士で議論させる
        </button>
      </section>

      <section class="side-column">
        <section class="panel avatar-panel">
          <div class="avatar-icon">✦</div>

          <div class="avatar-info">
            <p class="avatar-label">AI分身</p>
            <h2 id="avatarName">まだ召喚されていません</h2>
            <p id="avatarMeta">プロフィールを入力すると、あなたの分身がここに現れます。</p>
          </div>
        </section>

        <section class="panel chat-panel">
          <div class="section-heading">
            <span class="step-badge">Step 3</span>
            <h2>AIとの議論</h2>
          </div>

          <div id="chatArea" class="chat-area">
            <div class="empty-state">
              <p>まだ分身は召喚されていません。</p>
              <span>テーマを入力して「分身を召喚する」を押してね。</span>
            </div>
          </div>

          <div id="loadingText" class="loading-text"></div>

          <div class="chat-input-area">
            <input
              id="followupInput"
              type="text"
              placeholder="分身AIに追加で質問する..."
              disabled
            />

            <button
              id="sendButton"
              type="button"
              onclick="sendFollowup()"
              disabled
            >
              送信
            </button>
          </div>
        </section>
      </section>
    </main>

    <section class="panel result-panel">
      <div class="section-heading">
        <span class="step-badge">Result</span>
        <h2>議論まとめ</h2>
      </div>

      <div id="resultArea" class="result-area">
        <p>まだ議論していません。</p>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
