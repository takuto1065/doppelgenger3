<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>自分会議、開催中</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">
    <header class="app-header">
      <p class="eyebrow">AI Doppelgänger Discussion App</p>
      <h1>自分会議、開催中</h1>
      <p class="header-text">
        もう一人のあなたが、あなたの価値観で議論する。
      </p>
    </header>

    <main class="main-layout">
      <section class="panel form-panel">
        <div class="section-heading">
          <span class="step-badge">Step 1</span>
          <h2>分身プロフィール</h2>
        </div>

        <div class="form-grid">
          <label>
            名前
            <input id="nameInput" type="text" placeholder="例：あなた" />
          </label>

        <input id="nameInput" type="text" placeholder="名前">
        <input id="personalityInput" type="text" placeholder="性格">
        <input id="hobbyInput" type="text" placeholder="趣味">
        <textarea id="thoughtInput" placeholder="普段の考え方"></textarea>
        <input id="topicInput" type="text" placeholder="テーマ、AIに議論してほしいこと(未入力の場合AIが自動生成します。)">

        <button id="summonButton" class="primary-button" onclick="summonAI()">
          分身を召喚する
        </button>

        <button id="autoDebateButton" class="secondary-button" onclick="startAutoDebate()" disabled>
          AI同士で議論させる
        </button>
      </section>

      <section class="side-column">
        <section class="panel avatar-panel">
          <div class="avatar-icon">✦</div>

          <div class="avatar-info">
            <p class="avatar-label">AI分身</p>
            <h2 id="avatarName">まだ召喚されていません</h2>
            <p id="avatarMeta">プロフィールを入力すると、あなたの分身がここに現れます。</p>
          </div>
        </section>

        <section class="panel chat-panel">
          <div class="section-heading">
            <span class="step-badge">Step 3</span>
            <h2>AIとの議論</h2>
          </div>

          <div id="chatArea" class="chat-area">
            <div class="empty-state">
              <p>まだ分身は召喚されていません。</p>
              <span>テーマを入力して「分身を召喚する」を押してね。</span>
            </div>
          </div>

          <div id="loadingText" class="loading-text"></div>

          <div class="chat-input-area">
            <input
              id="followupInput"
              type="text"
              placeholder="分身AIに追加で質問する..."
              disabled
            />

            <button
              id="sendButton"
              type="button"
              onclick="sendFollowup()"
              disabled
            >
              送信
            </button>
          </div>
        </section>
      </section>
    </main>

    <section class="panel result-panel">
      <div class="section-heading">
        <span class="step-badge">Result</span>
        <h2>議論まとめ</h2>
      </div>

      <div id="resultArea" class="result-area">
        <p>まだ議論していません。</p>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
